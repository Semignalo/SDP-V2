[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "php83Extensions.curl",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.tokenizer",
  "php83Extensions.fileinfo",
  "php83Packages.composer"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --no-scripts --no-plugins"
]

[start]
cmd = "php artisan package:discover --ansi && php artisan migrate --force && php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
